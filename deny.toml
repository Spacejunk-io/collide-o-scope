[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
ignore = [
  "RUSTSEC-2025-0134", # tracked with owner/expiry in policy/dependency-exceptions.toml
  "RUSTSEC-2026-0192", # tracked with owner/expiry in policy/dependency-exceptions.toml
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/ntsc-rs/ntsc-rs"]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
include-dev = true
include-build = true
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "GPL-3.0-or-later",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Unlicense",
  "WTFPL",
  "Zlib",
]
