name: Release trust

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Candidate tag whose version must match Cargo.toml
        required: true
        default: v1.7.2

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  FFMPEG_VERSION: 8.1.2
  FFMPEG_WINDOWS_SHA256: 274923c68904a9b76c73b908f57923dafba81155856cd742138515ded570d066
  FFMPEG_SOURCE_COMMIT: 38b88335f99e76ed89ff3c93f877fdefce736c13
  LLVM_VERSION: 22.1.8
  LLVM_WINDOWS_INSTALLER_SHA256: 16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c
  LLVM_SOURCE_COMMIT: ca7933e47d3a3451d81e72ac174dcb5aa28b59d1
  LLVM_AR_SHA256: 80934e8f208a0cc2a87a6057f871d0f492461952b8672464749a6c3dff34109c
  LIBCLANG_SHA256: 51fed10c43c3d31c1fe5bfe76bac60150970961e9b9b23cf014dbfcb5398bbfc
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  verification-gate:
    name: Require exact-commit CI and adversarial success
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag_object: ${{ steps.source.outputs.tag_object }}
      required_runs: ${{ steps.required.outputs.required_runs }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out candidate tag verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve one immutable candidate commit
        id: source
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse 'HEAD^{commit}')"
          event_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          if [ "$event_commit" != "$commit" ]; then
            echo "Workflow event SHA and checked-out candidate disagree" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python scripts/verify-release.py annotated-tag \
              --tag "$RELEASE_TAG" \
              --commit "$commit" \
              --remote origin \
              --github-output "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
              echo "Pre-tag qualification must be dispatched from the repository default branch" >&2
              exit 1
            fi
            remote_default_rows="$(git ls-remote --heads origin "refs/heads/$DEFAULT_BRANCH")"
            remote_default_commit="$(printf '%s\n' "$remote_default_rows" | awk 'NF == 2 { print $1 }')"
            remote_default_ref="$(printf '%s\n' "$remote_default_rows" | awk 'NF == 2 { print $2 }')"
            if [ "$(printf '%s\n' "$remote_default_rows" | awk 'NF == 2 { count += 1 } END { print count + 0 }')" -ne 1 ] || \
               [ "$remote_default_ref" != "refs/heads/$DEFAULT_BRANCH" ] || \
               [ "$remote_default_commit" != "$commit" ]; then
              echo "Dispatched candidate is not the exact remote default-branch head" >&2
              exit 1
            fi
            version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
            if [ "$RELEASE_TAG" != "v$version" ]; then
              echo "Planned tag $RELEASE_TAG does not match Cargo version $version" >&2
              exit 1
            fi
            remote_rows="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
            if [ -n "$remote_rows" ]; then
              echo "Pre-tag qualification requires the planned tag to be absent" >&2
              exit 1
            fi
            python scripts/verify-release.py release-absent \
              --repository "$GITHUB_REPOSITORY" \
              --tag "$RELEASE_TAG"
            echo "tag_object=" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported Release trust event: $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Prove the required-workflow gate rejects stale status
        run: |
          python scripts/wait-required-workflows.py --self-test
          python scripts/check-release-workflow.py
          python scripts/verify-release.py self-test
          python scripts/finalize-release-receipt.py self-test

      - name: Wait for newest exact-commit verification runs
        id: required
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/wait-required-workflows.py \
            --repository "${{ github.repository }}" \
            --commit "${{ steps.source.outputs.commit }}" \
            --workflow ci.yml \
            --workflow adversarial.yml \
            --timeout-seconds 8400 \
            --poll-seconds 20 \
            --final-candidate-evidence \
            --github-output "$GITHUB_OUTPUT"

  reproduce-sign-publish:
    name: Reproduce, attest, and sign
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verification-gate
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      commit: ${{ needs.verification-gate.outputs.commit }}
      tag_object: ${{ needs.verification-gate.outputs.tag_object }}
      draft_id: ${{ steps.initial-draft.outputs.draft_id }}
      draft_tag: ${{ steps.initial-draft.outputs.draft_tag }}
      draft_state: ${{ steps.initial-draft.outputs.draft_state }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps: &windows_release_steps
      - name: Check out dependency-policy source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verification-gate.outputs.commit }}
          path: policy-source
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.98.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.98.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustcVersion = (rustc -Vv) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $rustcVersion -notmatch '(?m)^release: 1\.98\.0$') {
            throw "Rust 1.98.0 is not active"
          }

      - name: Cache Cargo downloads and release tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: release-tools-windows-auditable-0.7.5-cyclonedx-0.5.9-deny-0.20.2-audit-0.22.2-${{ hashFiles('policy-source/Cargo.lock') }}

      - name: Download and verify pinned LLVM toolchain
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_VERSION-win64.exe"
          $destination = "C:\collide-llvm-$env:LLVM_VERSION"
          if (Test-Path -LiteralPath $destination) {
            throw "Pinned LLVM destination already exists"
          }
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 5
          $installerHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($installerHash -cne $env:LLVM_WINDOWS_INSTALLER_SHA256) {
            throw "LLVM installer checksum mismatch"
          }
          gh attestation verify $installer `
            --repo llvm/llvm-project `
            --signer-workflow llvm/llvm-project/.github/workflows/release-binaries.yml `
            --source-ref "refs/tags/llvmorg-$env:LLVM_VERSION" `
            --source-digest $env:LLVM_SOURCE_COMMIT `
            --deny-self-hosted-runners
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sevenZip = (Get-Command 7z.exe -CommandType Application -ErrorAction Stop).Source
          & $sevenZip x $installer "-o$destination" 'bin\llvm-ar.exe' 'bin\libclang.dll' -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $llvmBin = Join-Path $destination 'bin'
          $llvmAr = Join-Path $llvmBin 'llvm-ar.exe'
          $libclang = Join-Path $llvmBin 'libclang.dll'
          if (-not (Test-Path -LiteralPath $llvmAr -PathType Leaf) -or -not (Test-Path -LiteralPath $libclang -PathType Leaf)) {
            throw "Pinned LLVM extraction is incomplete"
          }
          $extractedFiles = @(Get-ChildItem -LiteralPath $destination -File -Recurse -Force)
          $expectedFiles = @($llvmAr, $libclang) | Sort-Object
          $actualFiles = @($extractedFiles.FullName) | Sort-Object
          if ($actualFiles.Count -ne 2 -or (Compare-Object $expectedFiles $actualFiles)) {
            throw "Pinned LLVM extraction contains unexpected files"
          }
          $llvmArHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $llvmAr).Hash.ToLowerInvariant()
          if ($llvmArHash -cne $env:LLVM_AR_SHA256) { throw "llvm-ar.exe checksum mismatch" }
          $llvmArVersion = (& $llvmAr --version) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $llvmArVersion -notmatch "(?m)^  LLVM version $([regex]::Escape($env:LLVM_VERSION))$") {
            throw "llvm-ar.exe version mismatch"
          }
          $libclangHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $libclang).Hash.ToLowerInvariant()
          $libclangVersion = (Get-Item -LiteralPath $libclang -Force).VersionInfo.FileVersion
          if ($libclangHash -cne $env:LIBCLANG_SHA256 -or $libclangVersion -cne $env:LLVM_VERSION) {
            throw "libclang.dll identity mismatch"
          }
          "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV

      - name: Download pinned FFmpeg shared runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-$env:FFMPEG_VERSION-full_build-shared.zip"
          $destination = Join-Path $env:RUNNER_TEMP "ffmpeg-$env:FFMPEG_VERSION-windows"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/ffmpeg-$env:FFMPEG_VERSION-full_build-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:FFMPEG_WINDOWS_SHA256) { throw "FFmpeg archive checksum mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $ffmpeg = Get-ChildItem -LiteralPath $destination -Directory -Recurse |
            Where-Object Name -eq "ffmpeg-$env:FFMPEG_VERSION-full_build-shared" |
            Select-Object -First 1
          if ($null -eq $ffmpeg) { throw "FFmpeg shared runtime was not found" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsPath)) { throw "Visual Studio C++ tools were not found" }
          "FFMPEG_DIR=$($ffmpeg.FullName)" >> $env:GITHUB_ENV
          "VCVARS64=$(Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat')" >> $env:GITHUB_ENV

      - name: Install pinned release tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Install-PinnedCargoTool {
            param(
              [string]$Binary,
              [string]$Expected,
              [string]$Package,
              [string]$Version,
              [string[]]$VersionArguments = @("--version")
            )
            $command = Get-Command $Binary -ErrorAction SilentlyContinue
            $observed = if ($null -eq $command) { "" } else { (& $command.Source @VersionArguments).Trim() }
            if ($observed -ne $Expected) {
              cmd /c "`"$env:VCVARS64`" >nul && cargo install --locked --force $Package --version $Version"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            $verified = (& $Binary @VersionArguments).Trim()
            if ($verified -ne $Expected) {
              throw "$Binary version mismatch: expected '$Expected', got '$verified'"
            }
          }
          cmd /c "`"$env:VCVARS64`" >nul && cargo install --locked --force cargo-auditable --version 0.7.5"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verifiedInstalled = (cargo install --list) -join "`n"
          if ($verifiedInstalled -notmatch '(?m)^cargo-auditable v0\.7\.5:$') {
            throw "cargo-auditable 0.7.5 is not the installed package"
          }
          Install-PinnedCargoTool cargo-cyclonedx "cargo-cyclonedx-cyclonedx 0.5.9" cargo-cyclonedx 0.5.9 -VersionArguments @("cyclonedx", "--version")
          Install-PinnedCargoTool cargo-deny "cargo-deny 0.20.2" cargo-deny 0.20.2
          Install-PinnedCargoTool cargo-audit "cargo-audit 0.22.2" cargo-audit 0.22.2

      - name: Enforce dependency, license, and vendor gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location policy-source
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-vendored-wgpu-hal.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-dependency-policy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo deny check advisories bans sources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/run-cargo-audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo deny check licenses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare-dependency-evidence.py --self-test --output "$env:RUNNER_TEMP\dependency-license-inventory.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Check out independent source A
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verification-gate.outputs.commit }}
          path: source-a
          fetch-depth: 0
          persist-credentials: false

      - name: Check out independent source B
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verification-gate.outputs.commit }}
          path: source-b-with-deliberately-different-path-length
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and derive deterministic epoch
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path source-a\Cargo.toml -Pattern '^version = "([0-9]+\.[0-9]+\.[0-9]+)"$').Matches[0].Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG does not match Cargo version $version" }
          $commit = "${{ needs.verification-gate.outputs.commit }}".ToLowerInvariant()
          $sourceA = (git -C source-a rev-parse 'HEAD^{commit}').Trim().ToLowerInvariant()
          $sourceB = (git -C source-b-with-deliberately-different-path-length rev-parse 'HEAD^{commit}').Trim().ToLowerInvariant()
          if ($sourceA -ne $commit -or $sourceB -ne $commit) {
            throw "Independent sources and verified commit are not identical"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            python source-a\scripts\verify-release.py annotated-tag `
              --tag "$env:RELEASE_TAG" `
              --commit $commit `
              --tag-object "${{ needs.verification-gate.outputs.tag_object }}" `
              --remote origin
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $remoteRows = @(git -C source-a ls-remote --tags origin "refs/tags/$env:RELEASE_TAG" "refs/tags/$env:RELEASE_TAG^{}")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($remoteRows.Count -ne 0) {
              throw "Pre-tag qualification requires the planned tag to remain absent"
            }
          }
          $epoch = (git -C source-a show -s --format=%ct HEAD).Trim()
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "epoch=$epoch" >> $env:GITHUB_OUTPUT

      - name: Prove reproducibility checkouts are pristine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = 'NUL'
          $env:GIT_CONFIG_COUNT = '0'
          $env:GIT_ATTR_NOSYSTEM = '1'
          $expected = "${{ needs.verification-gate.outputs.commit }}".ToLowerInvariant()
          foreach ($source in @('source-a', 'source-b-with-deliberately-different-path-length')) {
            $head = (git -c core.fsmonitor=false -c core.hooksPath=NUL -C $source rev-parse 'HEAD^{commit}').Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $head -cne $expected) {
              throw "Reproducibility checkout does not match the verified commit: $source"
            }
            $dirty = @(git -c core.fsmonitor=false -c core.hooksPath=NUL -C $source status --porcelain=v1 --untracked-files=all)
            $statusExit = $LASTEXITCODE
            if ($statusExit -ne 0) {
              throw "Reproducibility checkout status failed: $source exit=$statusExit"
            }
            if ($dirty.Count -ne 0) {
              $boundedRows = @(
                $dirty | Select-Object -First 32 | ForEach-Object {
                  if ($_.Length -le 512) { $_ } else { $_.Substring(0, 512) + '<truncated>' }
                }
              )
              $details = $boundedRows | ConvertTo-Json -Compress
              throw "Reproducibility checkout is not pristine: $source rows=$($dirty.Count) first_rows_json=$details"
            }
          }

      - name: Prepare unequal physical reproducibility roots
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-NoReparsePathChain {
            param([string]$Path)
            $full = [IO.Path]::GetFullPath($Path)
            $root = [IO.Path]::GetPathRoot($full)
            $current = $root
            foreach ($component in $full.Substring($root.Length).Split([char[]]@('\', '/'), [StringSplitOptions]::RemoveEmptyEntries)) {
              $current = Join-Path $current $component
              if (-not (Test-Path -LiteralPath $current)) { throw "Missing path component: $current" }
              if (((Get-Item -LiteralPath $current -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "Reparse-point path is not an independent physical root: $current"
              }
            }
          }
          function Assert-NoReparseTree {
            param([string]$Path)
            $items = @((Get-Item -LiteralPath $Path -Force)) + @(Get-ChildItem -LiteralPath $Path -Force -Recurse)
            foreach ($item in $items) {
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "Reparse point is not permitted in a Cargo seed: $($item.FullName)"
              }
            }
          }
          function Copy-SeedTree {
            param([string]$Source, [string]$Destination)
            & robocopy.exe $Source $Destination /E /COPY:DAT /DCOPY:DAT /XJ /R:2 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
            $robocopyExit = $LASTEXITCODE
            if ($robocopyExit -ge 8) { throw "Cargo seed copy failed with exit code $robocopyExit" }
            $global:LASTEXITCODE = 0
          }
          function Get-ManifestDigest {
            param([string]$Path)
            $root = [IO.Path]::GetFullPath($Path).TrimEnd([char[]]@('\', '/'))
            $records = [Collections.Generic.List[string]]::new()
            foreach ($file in @(Get-ChildItem -LiteralPath $root -Force -Recurse -File)) {
              $relative = $file.FullName.Substring($root.Length).TrimStart([char[]]@('\', '/')).Replace('\', '/')
              $streams = @(Get-Item -LiteralPath $file.FullName -Stream *)
              if ($streams.Count -ne 1 -or $streams[0].Stream -cne ':$DATA') {
                throw "Alternate data stream is not permitted in a Cargo seed: $($file.FullName)"
              }
              $digest = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $records.Add("$relative`0$($file.Length)`0$digest")
            }
            $records.Sort([StringComparer]::Ordinal)
            $bytes = [Text.Encoding]::UTF8.GetBytes([string]::Join("`n", $records))
            return [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          }

          $defaultCargoHome = if ([string]::IsNullOrWhiteSpace($env:CARGO_HOME)) {
            Join-Path $env:USERPROFILE '.cargo'
          } else {
            $env:CARGO_HOME
          }
          $sourceA = (Resolve-Path -LiteralPath 'source-a').Path
          $sourceB = (Resolve-Path -LiteralPath 'source-b-with-deliberately-different-path-length').Path
          $cargoA = Join-Path $env:RUNNER_TEMP 'ca'
          $cargoB = Join-Path $env:RUNNER_TEMP 'cargo-seed-b-with-deliberately-different-physical-path-length'
          $targetA = Join-Path $env:RUNNER_TEMP 'ta'
          $targetB = Join-Path $env:RUNNER_TEMP 'target-b-with-deliberately-different-physical-path-length'
          foreach ($path in @($cargoA, $cargoB, $targetA, $targetB)) {
            if (Test-Path -LiteralPath $path) { throw "Reproducibility root must be absent: $path" }
          }
          foreach ($path in @($defaultCargoHome, $sourceA, $sourceB, $env:RUNNER_TEMP)) {
            Assert-NoReparsePathChain $path
          }
          foreach ($path in @($cargoA, $cargoB)) {
            [IO.Directory]::CreateDirectory((Join-Path $path 'registry')) | Out-Null
            [IO.Directory]::CreateDirectory((Join-Path $path 'git')) | Out-Null
            [IO.Directory]::CreateDirectory((Join-Path $path 'bin')) | Out-Null
          }
          foreach ($seed in @($cargoA, $cargoB)) {
            Copy-SeedTree (Join-Path $defaultCargoHome 'registry\cache') (Join-Path $seed 'registry\cache')
            Copy-SeedTree (Join-Path $defaultCargoHome 'registry\index') (Join-Path $seed 'registry\index')
            Copy-SeedTree (Join-Path $defaultCargoHome 'git\db') (Join-Path $seed 'git\db')
            [IO.File]::Copy((Join-Path $defaultCargoHome 'bin\cargo-auditable.exe'), (Join-Path $seed 'bin\cargo-auditable.exe'), $false)
            [IO.File]::Copy((Join-Path $defaultCargoHome '.crates.toml'), (Join-Path $seed '.crates.toml'), $false)
            [IO.File]::Copy((Join-Path $defaultCargoHome '.crates2.json'), (Join-Path $seed '.crates2.json'), $false)
            Assert-NoReparsePathChain $seed
            Assert-NoReparseTree $seed
          }
          $manifestA = Get-ManifestDigest $cargoA
          $manifestB = Get-ManifestDigest $cargoB
          if ($manifestA -cne $manifestB) { throw 'Independent Cargo seed manifests differ' }

          $roots = @($sourceA, $sourceB, $cargoA, $cargoB, $targetA, $targetB) |
            ForEach-Object { [IO.Path]::GetFullPath($_).TrimEnd([char[]]@('\', '/')) }
          $uniqueRoots = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($root in $roots) {
            if (-not $uniqueRoots.Add($root)) { throw "Reproducibility roots are not distinct: $root" }
          }
          for ($left = 0; $left -lt $roots.Count; $left++) {
            for ($right = $left + 1; $right -lt $roots.Count; $right++) {
              if (
                ($roots[$left] + '\').StartsWith($roots[$right] + '\', [StringComparison]::OrdinalIgnoreCase) -or
                ($roots[$right] + '\').StartsWith($roots[$left] + '\', [StringComparison]::OrdinalIgnoreCase)
              ) { throw 'Reproducibility roots overlap' }
            }
          }
          foreach ($pair in @(@($sourceA, $sourceB), @($cargoA, $cargoB), @($targetA, $targetB))) {
            if ($pair[0].Length -eq $pair[1].Length) { throw 'A/B path lengths must deliberately differ' }
          }
          "REPRO_SOURCE_A=$sourceA" >> $env:GITHUB_ENV
          "REPRO_SOURCE_B=$sourceB" >> $env:GITHUB_ENV
          "REPRO_CARGO_A=$cargoA" >> $env:GITHUB_ENV
          "REPRO_CARGO_B=$cargoB" >> $env:GITHUB_ENV
          "REPRO_TARGET_A=$targetA" >> $env:GITHUB_ENV
          "REPRO_TARGET_B=$targetB" >> $env:GITHUB_ENV
          "REPRO_CARGO_SEED_SHA256=$manifestA" >> $env:GITHUB_ENV

      - name: Build twice from clean independent unequal roots
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedProperties = @(
            'schema_version', 'contract', 'wrapper_sha256', 'source_commit', 'source_tree_sha', 'source_date_epoch',
            'source_archive_sha256', 'cargo_seed_manifest_sha256', 'cargo_expanded_manifest_sha256',
            'cargo_manifest_exclusions', 'cargo_auditable_sha256', 'ffmpeg_manifest_sha256',
            'ffmpeg_version', 'rustc_version', 'rustc_commit', 'cargo_version', 'cargo_commit',
            'llvm_ar_sha256', 'llvm_ar_version', 'libclang_sha256', 'libclang_version',
            'offline', 'canonical_root', 'executable_sha256', 'identity_sha256',
            'cleanup_succeeded', 'executable'
          )
          function Invoke-ReproducibleBuild {
            param(
              [string]$Source,
              [string]$Target,
              [string]$CargoSeed,
              [string]$ReceiptPath
            )
            $script = Join-Path $Source 'scripts\build-reproducible-windows.ps1'
            $priorCargoHome = [Environment]::GetEnvironmentVariable('CARGO_HOME', 'Process')
            try {
              [Environment]::SetEnvironmentVariable('CARGO_HOME', $CargoSeed, 'Process')
              $command = "`"$env:VCVARS64`" >nul && pwsh -NoProfile -File `"$script`" -SourceRoot `"$Source`" -TargetDir `"$Target`" -FfmpegDir `"$env:FFMPEG_DIR`" -GitSha ${{ steps.source.outputs.commit }} -SourceDateEpoch ${{ steps.source.outputs.epoch }}"
              $output = @(cmd.exe /d /s /c $command)
              $buildExit = $LASTEXITCODE
            } finally {
              [Environment]::SetEnvironmentVariable('CARGO_HOME', $priorCargoHome, 'Process')
            }
            if ($buildExit -ne 0) { exit $buildExit }
            $receiptLines = @($output | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            if ($receiptLines.Count -ne 1) { throw 'Reproducible wrapper did not emit exactly one JSON receipt' }
            try { $receipt = $receiptLines[0] | ConvertFrom-Json } catch { throw 'Reproducible wrapper emitted invalid JSON' }
            $observedProperties = @($receipt.PSObject.Properties.Name)
            if (@(Compare-Object $expectedProperties $observedProperties -SyncWindow 0).Count -ne 0) {
              throw 'Reproducible wrapper receipt schema changed'
            }
            if (
              $receipt.schema_version -ne 1 -or
              $receipt.contract -cne 'collide-windows-canonical-repro-v1' -or
              -not $receipt.offline -or -not $receipt.cleanup_succeeded -or
              $receipt.canonical_root -cne 'C:\cosrepro' -or
              (Test-Path -LiteralPath 'C:\cosrepro')
            ) { throw 'Canonical build transaction did not finish cleanly and offline' }
            $expectedExecutable = [IO.Path]::GetFullPath((Join-Path $Target 'release\collide-o-scope.exe'))
            if ([IO.Path]::GetFullPath($receipt.executable) -cne $expectedExecutable) {
              throw 'Receipt executable is not the intended caller target'
            }
            $publishedHash = (Get-FileHash -LiteralPath $expectedExecutable -Algorithm SHA256).Hash.ToLowerInvariant()
            $wrapperHash = (Get-FileHash -LiteralPath $script -Algorithm SHA256).Hash.ToLowerInvariant()
            if (
              $publishedHash -cne $receipt.executable_sha256 -or
              $wrapperHash -cne $receipt.wrapper_sha256 -or
              $receipt.cargo_seed_manifest_sha256 -cne $env:REPRO_CARGO_SEED_SHA256 -or
              $receipt.source_commit -cne '${{ steps.source.outputs.commit }}' -or
              (($receipt.cargo_manifest_exclusions -join ',') -cne '.global-cache,.package-cache,.package-cache-mutate,git/checkouts/ntsc-rs-5808ee35e7b6c97f/4b79500/.git/index,git/checkouts/ntsc-rs-5808ee35e7b6c97f/4b79500/.git/logs/HEAD,git/checkouts/ntsc-rs-5808ee35e7b6c97f/4b79500/.git/logs/refs/heads/master,git/checkouts/ntsc-rs-5808ee35e7b6c97f/4b79500/crates/openfx-plugin/vendor/openfx/.git/index,git/checkouts/ntsc-rs-5808ee35e7b6c97f/4b79500/crates/openfx-plugin/vendor/openfx/.git/logs/HEAD,git/checkouts/ntsc-rs-5808ee35e7b6c97f/4b79500/crates/openfx-plugin/vendor/openfx/.git/logs/refs/heads/master')
            ) { throw 'Reproducible wrapper receipt disagrees with its reviewed inputs or output' }
            [IO.File]::WriteAllText($ReceiptPath, ($receiptLines[0] + "`n"), [Text.UTF8Encoding]::new($false))
            return $receipt
          }

          $receiptAPath = Join-Path $env:RUNNER_TEMP 'canonical-repro-receipt-a.json'
          $receiptBPath = Join-Path $env:RUNNER_TEMP 'canonical-repro-receipt-b.json'
          $receiptA = Invoke-ReproducibleBuild $env:REPRO_SOURCE_A $env:REPRO_TARGET_A $env:REPRO_CARGO_A $receiptAPath
          if (Test-Path -LiteralPath 'C:\cosrepro') { throw 'Build A left the canonical root present' }
          $receiptB = Invoke-ReproducibleBuild $env:REPRO_SOURCE_B $env:REPRO_TARGET_B $env:REPRO_CARGO_B $receiptBPath
          if (Test-Path -LiteralPath 'C:\cosrepro') { throw 'Build B left the canonical root present' }
          foreach ($property in $expectedProperties | Where-Object { $_ -cne 'executable' }) {
            $left = $receiptA.$property | ConvertTo-Json -Compress -Depth 8
            $right = $receiptB.$property | ConvertTo-Json -Compress -Depth 8
            if ($left -cne $right) { throw "Independent build receipts differ at $property" }
          }

      - name: Generate reproducible CycloneDX SBOM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:SOURCE_DATE_EPOCH = "${{ steps.source.outputs.epoch }}"
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = 'NUL'
          $env:GIT_CONFIG_COUNT = '0'
          $env:GIT_ATTR_NOSYSTEM = '1'
          $expectedName = 'collide-o-scope.cdx.json'
          $normalizedA = Join-Path $env:RUNNER_TEMP $expectedName
          $normalizedB = Join-Path $env:RUNNER_TEMP 'collide-o-scope-b.cdx.json'
          $policyScript = Join-Path $env:REPRO_SOURCE_A 'scripts\cyclonedx_sbom.py'
          foreach ($path in @($normalizedA, $normalizedB)) {
            if (Test-Path -LiteralPath $path) { throw 'Normalized SBOM output must be absent' }
          }
          python $policyScript self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          function New-NormalizedSbom {
            param(
              [Parameter(Mandatory = $true)][string]$SourceLiteral,
              [Parameter(Mandatory = $true)][string]$Normalized,
              [Parameter(Mandatory = $true)][string]$Label
            )
            $sourceItem = Get-Item -LiteralPath $SourceLiteral -Force
            if (
              -not $sourceItem.PSIsContainer -or
              $null -ne $sourceItem.LinkType -or
              ($sourceItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
            ) { throw "SBOM source $Label is not one exact ordinary directory" }
            $source = $sourceItem.FullName
            $before = @(git -c core.fsmonitor=false -c core.hooksPath=NUL -C $source status --porcelain=v1 --untracked-files=all)
            $beforeExit = $LASTEXITCODE
            if ($beforeExit -ne 0 -or $before.Count -ne 0) { throw "SBOM source $Label must be pristine before generation" }
            $preexisting = @(Get-ChildItem -LiteralPath $source -Force | Where-Object { $_.Name -like 'collide-o-scope.cdx*' })
            if ($preexisting.Count -ne 0) { throw "SBOM output path $Label must be absent before generation" }
            Push-Location $source
            try {
              cargo cyclonedx --format json --spec-version 1.5 --override-filename collide-o-scope.cdx | Out-Host
              $cargoExit = $LASTEXITCODE
            } finally {
              Pop-Location
            }
            if ($cargoExit -ne 0) { exit $cargoExit }
            $outputs = @(Get-ChildItem -LiteralPath $source -Force | Where-Object { $_.Name -like 'collide-o-scope.cdx*' })
            if (
              $outputs.Count -ne 1 -or
              $outputs[0].Name -cne $expectedName -or
              $outputs[0].PSIsContainer -or
              $null -ne $outputs[0].LinkType -or
              ($outputs[0].Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
            ) { throw "SBOM output inventory $Label is not one exact ordinary file" }
            $after = @(git -c core.fsmonitor=false -c core.hooksPath=NUL -C $source status --porcelain=v1 --untracked-files=all)
            $afterExit = $LASTEXITCODE
            if ($afterExit -ne 0 -or $after.Count -ne 1 -or $after[0] -cne "?? $expectedName") {
              throw "SBOM generation $Label changed an unexpected source path"
            }
            python $policyScript normalize `
              --input $outputs[0].FullName `
              --source-root $source `
              --output $Normalized `
              --source-date-epoch "${{ steps.source.outputs.epoch }}" `
              --commit "${{ steps.source.outputs.commit }}" | Out-Host
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $normalizedItem = Get-Item -LiteralPath $Normalized -Force
            if (
              $normalizedItem.Name -cne [IO.Path]::GetFileName($Normalized) -or
              $normalizedItem.PSIsContainer -or
              $null -ne $normalizedItem.LinkType -or
              ($normalizedItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
            ) { throw "Normalized SBOM $Label is not one exact ordinary file" }
            return [pscustomobject]@{
              Label = $Label
              Raw = $outputs[0].FullName
              Normalized = $normalizedItem.FullName
              Length = $normalizedItem.Length
              Sha256 = (Get-FileHash -LiteralPath $normalizedItem.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }

          $sbomA = New-NormalizedSbom $env:REPRO_SOURCE_A $normalizedA 'A'
          $sbomB = New-NormalizedSbom $env:REPRO_SOURCE_B $normalizedB 'B'
          $bytesA = [IO.File]::ReadAllBytes($sbomA.Normalized)
          $bytesB = [IO.File]::ReadAllBytes($sbomB.Normalized)
          if (
            $sbomA.Length -ne $sbomB.Length -or
            $sbomA.Sha256 -cne $sbomB.Sha256 -or
            [Convert]::ToBase64String($bytesA) -cne [Convert]::ToBase64String($bytesB)
          ) { throw 'Independent unequal-root normalized SBOMs are not byte-identical' }
          Remove-Item -LiteralPath $sbomA.Raw
          Remove-Item -LiteralPath $sbomB.Raw
          foreach ($source in @($env:REPRO_SOURCE_A, $env:REPRO_SOURCE_B)) {
            $final = @(git -c core.fsmonitor=false -c core.hooksPath=NUL -C $source status --porcelain=v1 --untracked-files=all)
            $finalExit = $LASTEXITCODE
            if ($finalExit -ne 0 -or $final.Count -ne 0) { throw 'SBOM source did not return to pristine state' }
          }
          Write-Output "Unequal-root normalized SBOM: $($sbomA.Length) bytes $($sbomA.Sha256)"

      - name: Assemble deterministic package and provenance
        shell: pwsh
        run: |
          $tagState = if ($env:GITHUB_EVENT_NAME -ceq 'push') {
            'annotated'
          } elseif ($env:GITHUB_EVENT_NAME -ceq 'workflow_dispatch') {
            'absent'
          } else {
            throw 'Unsupported release workflow event'
          }
          New-Item -ItemType Directory -Path release | Out-Null
          python source-a\scripts\verify-release.py prepare `
            --executable "$env:REPRO_TARGET_A\release\collide-o-scope.exe" `
            --second-executable "$env:REPRO_TARGET_B\release\collide-o-scope.exe" `
            --ffmpeg-bin "$env:FFMPEG_DIR\bin" `
            --ffmpeg-version "$env:FFMPEG_VERSION" `
            --ffmpeg-archive-sha256 "$env:FFMPEG_WINDOWS_SHA256" `
            --ffmpeg-source-commit "$env:FFMPEG_SOURCE_COMMIT" `
            --sbom "$env:RUNNER_TEMP\collide-o-scope.cdx.json" `
            --dependency-inventory "$env:RUNNER_TEMP\dependency-license-inventory.json" `
            --tag "$env:RELEASE_TAG" `
            --tag-state $tagState `
            --commit "${{ steps.source.outputs.commit }}" `
            --source-date-epoch "${{ steps.source.outputs.epoch }}" `
            --output release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source-a\scripts\verify-release.py verify --directory release --tag "$env:RELEASE_TAG" --tag-state $tagState --commit "${{ steps.source.outputs.commit }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v2.6.0

      - name: Revalidate pre-tag absence after qualification
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "${{ needs.verification-gate.outputs.commit }}".ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($env:DEFAULT_BRANCH) -or
              $env:GITHUB_REF -cne "refs/heads/$env:DEFAULT_BRANCH") {
            throw "Pre-tag qualification is no longer bound to the repository default branch"
          }
          $defaultRows = @(git -C source-a ls-remote --heads origin "refs/heads/$env:DEFAULT_BRANCH")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($defaultRows.Count -ne 1) {
            throw "Remote default branch did not resolve exactly once"
          }
          $defaultColumns = @($defaultRows[0] -split "`t")
          if ($defaultColumns.Count -ne 2 -or
              $defaultColumns[0].ToLowerInvariant() -cne $expected -or
              $defaultColumns[1] -cne "refs/heads/$env:DEFAULT_BRANCH") {
            throw "Remote default-branch head changed during pre-tag qualification"
          }
          $tagRows = @(git -C source-a ls-remote --tags origin "refs/tags/$env:RELEASE_TAG" "refs/tags/$env:RELEASE_TAG^{}")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tagRows.Count -ne 0) {
            throw "Pre-tag qualification requires the planned tag to remain absent"
          }
          python source-a\scripts\verify-release.py release-absent `
            --repository "${{ github.repository }}" `
            --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keyless-sign the checksum manifest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          cosign sign-blob --yes --bundle release\SHA256SUMS.sigstore.json release\SHA256SUMS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cosign verify-blob `
            --bundle release\SHA256SUMS.sigstore.json `
            --certificate-oidc-issuer https://token.actions.githubusercontent.com `
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release-trust.yml@refs/.*$" `
            release\SHA256SUMS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source-a\scripts\verify-release.py verify --directory release --tag "$env:RELEASE_TAG" --tag-state annotated --commit "${{ steps.source.outputs.commit }}" --require-signature
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attest release evidence
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: release/*

      - name: Upload release evidence
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Revalidate the live tag before publication
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          python source-a\scripts\verify-release.py annotated-tag `
            --tag "$env:RELEASE_TAG" `
            --commit "${{ needs.verification-gate.outputs.commit }}" `
            --tag-object "${{ needs.verification-gate.outputs.tag_object }}" `
            --remote origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create release and upload initial assets once
        id: initial-draft
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          python source-a\scripts\verify-release.py release-absent `
            --repository "${{ github.repository }}" `
            --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = @(Get-ChildItem -LiteralPath release -File | Sort-Object Name)
          if ($assets.Count -ne 10) {
            throw "Create-only publication requires exactly ten initial assets"
          }
          gh release create "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --target "${{ needs.verification-gate.outputs.commit }}" `
            --verify-tag `
            --draft `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $draftJson = gh release view "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --json databaseId,tagName,isDraft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $draft = $draftJson | ConvertFrom-Json
          if (
            -not ($draft.databaseId -is [long] -or $draft.databaseId -is [int]) -or
            [long]$draft.databaseId -le 0 -or
            $draft.tagName -cne $env:RELEASE_TAG -or
            $draft.isDraft -ne $true
          ) {
            throw "New release did not resolve to one exact authenticated draft"
          }
          $draftId = [long]$draft.databaseId
          "draft_id=$draftId" >> $env:GITHUB_OUTPUT
          "draft_tag=$($draft.tagName)" >> $env:GITHUB_OUTPUT
          "draft_state=$($draft.isDraft.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $assetPaths = @($assets | ForEach-Object FullName)
          gh release upload "$env:RELEASE_TAG" @assetPaths `
            --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uploadedDraft = gh release view "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --json databaseId,tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (
            [long]$uploadedDraft.databaseId -ne $draftId -or
            $uploadedDraft.tagName -cne $env:RELEASE_TAG -or
            $uploadedDraft.isDraft -ne $true
          ) {
            throw "Initial upload is no longer bound to the created draft"
          }

  reproduce-qualify:
    name: Qualify reproducible release without publication authority
    if: github.event_name == 'workflow_dispatch'
    needs: verification-gate
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      attestations: read
      contents: read
    steps: *windows_release_steps

  redownload-verify:
    name: Verify draft and publish only after persistence checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - verification-gate
      - reproduce-sign-publish
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      EXPECTED_DRAFT_ID: ${{ needs.reproduce-sign-publish.outputs.draft_id }}
      EXPECTED_DRAFT_TAG: ${{ needs.reproduce-sign-publish.outputs.draft_tag }}
      EXPECTED_DRAFT_STATE: ${{ needs.reproduce-sign-publish.outputs.draft_state }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.reproduce-sign-publish.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v2.6.0

      - name: Redownload published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $draftJson = gh release view "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --json databaseId,tagName,isDraft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $draft = $draftJson | ConvertFrom-Json
          if (
            [long]$draft.databaseId -ne [long]$env:EXPECTED_DRAFT_ID -or
            $draft.tagName -cne $env:EXPECTED_DRAFT_TAG -or
            $env:EXPECTED_DRAFT_TAG -cne $env:RELEASE_TAG -or
            $draft.isDraft -ne $true -or
            $env:EXPECTED_DRAFT_STATE -cne "true"
          ) {
            throw "Release identity changed or was published before draft verification"
          }
          New-Item -ItemType Directory -Path downloaded | Out-Null
          gh release download "$env:RELEASE_TAG" --repo "${{ github.repository }}" --dir downloaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify exact initial assets, identity, and every attestation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RUNS_JSON: ${{ needs.verification-gate.outputs.required_runs }}
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "${{ needs.reproduce-sign-publish.outputs.commit }}".ToLowerInvariant()
          python scripts\verify-release.py annotated-tag `
            --tag "$env:RELEASE_TAG" `
            --commit $expected `
            --tag-object "${{ needs.verification-gate.outputs.tag_object }}" `
            --remote origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cosign verify-blob `
            --bundle downloaded\SHA256SUMS.sigstore.json `
            --certificate-oidc-issuer https://token.actions.githubusercontent.com `
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release-trust.yml@${{ github.ref }}" `
            downloaded\SHA256SUMS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\verify-release.py verify `
            --directory downloaded `
            --tag "$env:RELEASE_TAG" `
            --tag-state annotated `
            --commit $expected `
            --require-signature `
            --report-output "$env:RUNNER_TEMP\downloaded-verification.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = @(Get-ChildItem -LiteralPath downloaded -File | Sort-Object Name)
          if ($assets.Count -ne 10) { throw "Exact initial release must contain ten assets" }
          $attestationIdentity = "https://github.com/${{ github.repository }}/.github/workflows/release-trust.yml@${{ github.ref }}"
          $attestationSourceRef = "refs/tags/$env:RELEASE_TAG"
          $attestations = @()
          foreach ($asset in $assets) {
            gh attestation verify $asset.FullName `
              --repo "${{ github.repository }}" `
              --cert-identity $attestationIdentity `
              --cert-oidc-issuer https://token.actions.githubusercontent.com `
              --predicate-type https://slsa.dev/provenance/v1 `
              --source-ref $attestationSourceRef `
              --source-digest $expected
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $attestations += [ordered]@{
              name = $asset.Name
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash.ToLowerInvariant()
              verified = $true
            }
          }
          $attestationDocument = [ordered]@{
            schema_version = 2
            repository = "${{ github.repository }}"
            commit = $expected
            policy = [ordered]@{
              repository = "${{ github.repository }}"
              certificate_identity = $attestationIdentity
              certificate_oidc_issuer = "https://token.actions.githubusercontent.com"
              predicate_type = "https://slsa.dev/provenance/v1"
              source_ref = $attestationSourceRef
              source_digest = $expected
            }
            assets = $attestations
          }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText(
            "$env:RUNNER_TEMP\initial-asset-attestations.json",
            (($attestationDocument | ConvertTo-Json -Depth 4) + "`n"),
            $utf8
          )
          if ([string]::IsNullOrWhiteSpace($env:REQUIRED_RUNS_JSON)) {
            throw "Required-run receipt was not propagated"
          }
          [IO.File]::WriteAllText(
            "$env:RUNNER_TEMP\required-workflows.json",
            ($env:REQUIRED_RUNS_JSON + "`n"),
            $utf8
          )

      - name: Build the bounded external final-release receipt
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path final-release | Out-Null
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/$env:RELEASE_TAG"
          $receipt = "final-release\collide-o-scope-$env:RELEASE_TAG-final-release-receipt.json"
          python scripts\finalize-release-receipt.py build `
            --directory downloaded `
            --verification-report "$env:RUNNER_TEMP\downloaded-verification.json" `
            --attestations "$env:RUNNER_TEMP\initial-asset-attestations.json" `
            --required-runs "$env:RUNNER_TEMP\required-workflows.json" `
            --tag "$env:RELEASE_TAG" `
            --commit "${{ needs.reproduce-sign-publish.outputs.commit }}" `
            --tag-object "${{ needs.verification-gate.outputs.tag_object }}" `
            --repository "${{ github.repository }}" `
            --release-url $releaseUrl `
            --release-database-id "$env:EXPECTED_DRAFT_ID" `
            --workflow-identity "https://github.com/${{ github.repository }}/.github/workflows/release-trust.yml@${{ github.ref }}" `
            --output $receipt `
            --summary-output "final-release\release-summary.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\finalize-release-receipt.py validate --receipt $receipt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keyless-sign the frozen final-release receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $receipt = "final-release\collide-o-scope-$env:RELEASE_TAG-final-release-receipt.json"
          $bundle = "final-release\collide-o-scope-$env:RELEASE_TAG-final-release-receipt.sigstore.json"
          cosign sign-blob --yes --bundle $bundle $receipt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cosign verify-blob `
            --bundle $bundle `
            --certificate-oidc-issuer https://token.actions.githubusercontent.com `
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release-trust.yml@${{ github.ref }}" `
            $receipt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attest the frozen final-release receipt
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: final-release/collide-o-scope-${{ env.RELEASE_TAG }}-final-release-receipt.json

      - name: Verify and publish the external final-release receipt
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $receipt = "final-release\collide-o-scope-$env:RELEASE_TAG-final-release-receipt.json"
          $bundle = "final-release\collide-o-scope-$env:RELEASE_TAG-final-release-receipt.sigstore.json"
          $expectedDraftId = [long]$env:EXPECTED_DRAFT_ID
          $expected = "${{ needs.reproduce-sign-publish.outputs.commit }}"
          $attestationIdentity = "https://github.com/${{ github.repository }}/.github/workflows/release-trust.yml@${{ github.ref }}"
          $attestationSourceRef = "refs/tags/$env:RELEASE_TAG"
          $beforeUploadJson = gh release view "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --json databaseId,tagName,isDraft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $beforeUpload = $beforeUploadJson | ConvertFrom-Json
          if (
            [long]$beforeUpload.databaseId -ne $expectedDraftId -or
            $beforeUpload.tagName -cne $env:EXPECTED_DRAFT_TAG -or
            $beforeUpload.isDraft -ne $true
          ) {
            throw "Final receipt upload is not bound to the authenticated draft"
          }
          gh attestation verify $receipt `
            --repo "${{ github.repository }}" `
            --cert-identity $attestationIdentity `
            --cert-oidc-issuer https://token.actions.githubusercontent.com `
            --predicate-type https://slsa.dev/provenance/v1 `
            --source-ref $attestationSourceRef `
            --source-digest $expected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload "$env:RELEASE_TAG" $receipt $bundle --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --notes-file "final-release\release-summary.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $viewJson = gh release view "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --json databaseId,tagName,body,assets,isDraft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $view = $viewJson | ConvertFrom-Json
          $expectedUrl = "https://github.com/${{ github.repository }}/releases/tag/$env:RELEASE_TAG"
          $expectedBody = (Get-Content -LiteralPath "final-release\release-summary.md" -Raw).TrimEnd()
          if (
            [long]$view.databaseId -ne $expectedDraftId -or
            $view.tagName -cne $env:EXPECTED_DRAFT_TAG -or
            $view.isDraft -ne $true -or
            $view.body.TrimEnd() -cne $expectedBody
          ) {
            throw "Draft release state, URL, or final summary differs after edit"
          }
          $expectedAssets = @(
            @(Get-ChildItem -LiteralPath downloaded -File | ForEach-Object Name)
            (Split-Path -Leaf $receipt)
            (Split-Path -Leaf $bundle)
          ) | Sort-Object
          $publishedAssets = @($view.assets | ForEach-Object name | Sort-Object)
          if (
            $expectedAssets.Count -ne 12 -or
            $publishedAssets.Count -ne 12 -or
            (Compare-Object -ReferenceObject $expectedAssets -DifferenceObject $publishedAssets).Count -ne 0
          ) {
            throw "Draft release asset inventory differs after final receipt upload"
          }
          New-Item -ItemType Directory -Path published-complete | Out-Null
          gh release download "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --dir published-complete
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publishedFiles = @(Get-ChildItem -LiteralPath published-complete -File | Sort-Object Name)
          if ($publishedFiles.Count -ne 12) {
            throw "Fresh post-edit download did not contain exactly twelve assets"
          }
          for ($index = 0; $index -lt $expectedAssets.Count; $index++) {
            if ($publishedFiles[$index].Name -cne $expectedAssets[$index]) {
              throw "Fresh post-edit asset inventory differs by exact name"
            }
          }
          $expectedSources = [System.Collections.Generic.Dictionary[string,string]]::new(
            [System.StringComparer]::Ordinal
          )
          foreach ($asset in @(Get-ChildItem -LiteralPath downloaded -File)) {
            $expectedSources.Add($asset.Name, $asset.FullName)
          }
          $expectedSources.Add((Split-Path -Leaf $receipt), $receipt)
          $expectedSources.Add((Split-Path -Leaf $bundle), $bundle)
          foreach ($published in $publishedFiles) {
            if (-not $expectedSources.ContainsKey($published.Name)) {
              throw "Fresh post-edit download contains an unexpected asset"
            }
            $publishedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $published.FullName).Hash
            $expectedHash = (
              Get-FileHash -Algorithm SHA256 -LiteralPath $expectedSources[$published.Name]
            ).Hash
            if ($publishedHash -cne $expectedHash) {
              throw "Fresh post-edit asset differs from the exact initially verified bytes: $($published.Name)"
            }
          }
          New-Item -ItemType Directory -Path published-initial | Out-Null
          $initialNames = @(Get-ChildItem -LiteralPath downloaded -File | ForEach-Object Name)
          if ($initialNames.Count -ne 10) {
            throw "Initial verification inventory no longer contains exactly ten assets"
          }
          foreach ($name in $initialNames) {
            Copy-Item -LiteralPath (Join-Path published-complete $name) `
              -Destination (Join-Path published-initial $name)
          }
          $publishedChecksums = "published-initial\SHA256SUMS"
          $publishedChecksumBundle = "published-initial\SHA256SUMS.sigstore.json"
          cosign verify-blob `
            --bundle $publishedChecksumBundle `
            --certificate-oidc-issuer https://token.actions.githubusercontent.com `
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release-trust.yml@${{ github.ref }}" `
            $publishedChecksums
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\verify-release.py verify `
            --directory published-initial `
            --tag "$env:RELEASE_TAG" `
            --tag-state annotated `
            --commit "${{ needs.reproduce-sign-publish.outputs.commit }}" `
            --require-signature
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($asset in @(Get-ChildItem -LiteralPath published-initial -File)) {
            gh attestation verify $asset.FullName `
              --repo "${{ github.repository }}" `
              --cert-identity $attestationIdentity `
              --cert-oidc-issuer https://token.actions.githubusercontent.com `
              --predicate-type https://slsa.dev/provenance/v1 `
              --source-ref $attestationSourceRef `
              --source-digest $expected
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $publishedReceipt = Join-Path published-complete (Split-Path -Leaf $receipt)
          $publishedBundle = Join-Path published-complete (Split-Path -Leaf $bundle)
          python scripts\finalize-release-receipt.py validate --receipt $publishedReceipt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cosign verify-blob `
            --bundle $publishedBundle `
            --certificate-oidc-issuer https://token.actions.githubusercontent.com `
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release-trust.yml@${{ github.ref }}" `
            $publishedReceipt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh attestation verify $publishedReceipt `
            --repo "${{ github.repository }}" `
            --cert-identity $attestationIdentity `
            --cert-oidc-issuer https://token.actions.githubusercontent.com `
            --predicate-type https://slsa.dev/provenance/v1 `
            --source-ref $attestationSourceRef `
            --source-digest $expected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\verify-release.py annotated-tag `
            --tag "$env:RELEASE_TAG" `
            --commit "${{ needs.reproduce-sign-publish.outputs.commit }}" `
            --tag-object "${{ needs.verification-gate.outputs.tag_object }}" `
            --remote origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publishedViewJson = gh release view "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --json databaseId,tagName,url,body,assets,isDraft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publishedView = $publishedViewJson | ConvertFrom-Json
          $finalAssets = @($publishedView.assets | ForEach-Object name | Sort-Object)
          if (
            [long]$publishedView.databaseId -ne $expectedDraftId -or
            $publishedView.tagName -cne $env:EXPECTED_DRAFT_TAG -or
            $publishedView.isDraft -ne $false -or
            $publishedView.url -cne $expectedUrl -or
            $publishedView.body.TrimEnd() -cne $expectedBody -or
            $finalAssets.Count -ne 12 -or
            (Compare-Object -ReferenceObject $expectedAssets -DifferenceObject $finalAssets).Count -ne 0
          ) {
            throw "Final publication did not preserve the verified URL, body, and exact assets"
          }
          for ($index = 0; $index -lt $expectedAssets.Count; $index++) {
            if ($finalAssets[$index] -cne $expectedAssets[$index]) {
              throw "Final publication changed exact asset-name casing"
            }
          }
          New-Item -ItemType Directory -Path published-final-state | Out-Null
          gh release download "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --dir published-final-state
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $finalFiles = @(
            Get-ChildItem -LiteralPath published-final-state -File | Sort-Object Name
          )
          if ($finalFiles.Count -ne 12) {
            throw "Final published redownload did not contain exactly twelve assets"
          }
          for ($index = 0; $index -lt $expectedAssets.Count; $index++) {
            if ($finalFiles[$index].Name -cne $expectedAssets[$index]) {
              throw "Final published redownload changed exact asset names"
            }
            $draftHash = (
              Get-FileHash -Algorithm SHA256 `
                -LiteralPath (Join-Path published-complete $expectedAssets[$index])
            ).Hash
            $finalHash = (
              Get-FileHash -Algorithm SHA256 -LiteralPath $finalFiles[$index].FullName
            ).Hash
            if ($finalHash -cne $draftHash) {
              throw "Final published asset differs from verified draft bytes: $($expectedAssets[$index])"
            }
          }
          python scripts\verify-release.py annotated-tag `
            --tag "$env:RELEASE_TAG" `
            --commit "${{ needs.reproduce-sign-publish.outputs.commit }}" `
            --tag-object "${{ needs.verification-gate.outputs.tag_object }}" `
            --remote origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
