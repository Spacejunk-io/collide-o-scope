name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  FFMPEG_VERSION: 9.0.1
  FFMPEG_SOURCE_SHA256: cf38e0e28c7e5605942c4a77755349b0145804a397af37eb1fb4c77cb237f635
  FFMPEG_SOURCE_SIZE: "12036420"
  FFMPEG_SOURCE_SIGNATURE_SHA256: b613a00005232a1245ace7080088781ac23a916119d3e5b0d6c042368eee0177
  FFMPEG_SOURCE_SIGNATURE_SIZE: "520"
  FFMPEG_SIGNING_KEY_SHA256: 397b3becedcd5a98769967ff1ff8501ddc89f8368b8f766e4701377d7dbaabe5
  FFMPEG_SIGNING_KEY_SIZE: "1709"
  FFMPEG_SIGNING_KEY_FINGERPRINT: FCF986EA15E6E293A5644F10B4322F04D67658D8
  FFMPEG_SOURCE_COMMIT: bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa
  FFMPEG_WINDOWS_SHA256: 6fd54b3b4f49117a307877b570f5e1659090f178973298658b41f5c559b5b5ab
  FFMPEG_WINDOWS_SIZE: "97261187"

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Ubuntu 24.04)
            os: ubuntu-24.04
          - name: macOS 15
            os: macos-15
          - name: Windows (VS 2022)
            os: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust with lint components
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustc --version --verbose
          cargo --version

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Fetch the locked dependency graph
        run: cargo fetch --locked

      - name: Verify the vendored wgpu-hal archive and sole patch
        # The dependency is path-patched, so `cargo fetch` intentionally does
        # not cache the upstream .crate on a fresh runner. The verifier may
        # download only its manifest-pinned archive and authenticates it before
        # reading any member.
        run: python scripts/verify-vendored-wgpu-hal.py --self-test

      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Fail fast on a stalled Ubuntu mirror instead of hanging: a prior run
          # sat ~45 min in `apt-get update` before the job was cancelled. Bound
          # each connection and retry a few times, matching the FFmpeg fetch
          # steps' existing network-retry convention.
          sudo tee /etc/apt/apt.conf.d/80-ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get update; then
              break
            elif [ "$attempt" -eq 3 ]; then
              echo "::error::apt-get update failed after 3 attempts" >&2
              exit 1
            else
              echo "::warning::apt-get update attempt $attempt failed; retrying" >&2
              sleep "$((attempt * 10))"
            fi
          done
          # The install needs the identical stall bound: a mirror once dribbled
          # the 28.8 MB libclang download for ten minutes without tripping
          # Acquire::http::Timeout (which catches dead connections, not slow
          # ones) and the whole step timed out with no retry. A killed attempt
          # leaves partial downloads that the next attempt reuses or refetches.
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get install --yes --no-install-recommends \
              build-essential \
              clang \
              curl \
              gnupg \
              iproute2 \
              libasound2-dev \
              libclang-dev \
              libvulkan1 \
              mesa-vulkan-drivers \
              pkg-config \
              tcpdump \
              vulkan-tools \
              xz-utils; then
              break
            elif [ "$attempt" -eq 3 ]; then
              echo "::error::apt-get install failed after 3 attempts" >&2
              exit 1
            else
              echo "::warning::apt-get install attempt $attempt failed; retrying" >&2
              sleep "$((attempt * 10))"
            fi
          done

          # The persistent-object acceptance tests intentionally exercise real
          # wgpu allocations. Hosted Linux runners have no physical adapter, so
          # provide Mesa's bounded CPU Vulkan implementation instead of skipping
          # the tests or depending on whatever graphics stack the image happens
          # to contain.
          runtime_dir="$RUNNER_TEMP/xdg-runtime"
          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          mapfile -t lvp_icds < <(
            dpkg-query -L mesa-vulkan-drivers |
              grep -E '/lvp_icd[^/]*\.json$'
          )
          if [ "${#lvp_icds[@]}" -ne 1 ] || [ ! -f "${lvp_icds[0]:-}" ]; then
            echo "::error::expected exactly one installed Mesa lavapipe ICD manifest" >&2
            printf '%s\n' "${lvp_icds[@]:-}" >&2
            exit 1
          fi
          lvp_icd="${lvp_icds[0]}"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export WGPU_BACKEND="vulkan"
          export VK_DRIVER_FILES="$lvp_icd"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$lvp_icd" >> "$GITHUB_ENV"
          vulkaninfo --summary

      - name: Verify macOS native prerequisites
        if: runner.os == 'macOS'
        run: |
          command -v make
          command -v pkg-config
          command -v xz
          llvm_prefix="$(brew --prefix llvm@18)"
          test -f "$llvm_prefix/lib/libclang.dylib"
          echo "LIBCLANG_PATH=$llvm_prefix/lib" >> "$GITHUB_ENV"

      - name: Verify FFmpeg 9.0.1 source signature and identity on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-$FFMPEG_VERSION.tar.xz"
          signature="$archive.asc"
          signing_key="$RUNNER_TEMP/ffmpeg-devel.asc"

          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz"
          curl --fail --location --retry 3 \
            --output "$signature" \
            "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz.asc"
          curl --fail --location --retry 3 \
            --output "$signing_key" \
            "https://ffmpeg.org/ffmpeg-devel.asc"

          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          test "$(sha256_file "$archive")" = "$FFMPEG_SOURCE_SHA256"
          test "$(wc -c < "$archive" | tr -d ' ')" = "$FFMPEG_SOURCE_SIZE"
          test "$(sha256_file "$signature")" = "$FFMPEG_SOURCE_SIGNATURE_SHA256"
          test "$(wc -c < "$signature" | tr -d ' ')" = "$FFMPEG_SOURCE_SIGNATURE_SIZE"
          test "$(sha256_file "$signing_key")" = "$FFMPEG_SIGNING_KEY_SHA256"
          test "$(wc -c < "$signing_key" | tr -d ' ')" = "$FFMPEG_SIGNING_KEY_SIZE"

          # One hosted Linux gate verifies the detached OpenPGP signature with
          # an isolated keyring. macOS independently authenticates the same
          # source, signature, and key bytes by their pinned hashes.
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v gpg
            export GNUPGHOME="$RUNNER_TEMP/ffmpeg-gnupg"
            install -d -m 700 "$GNUPGHOME"
            fingerprint="$(
              gpg --batch --with-colons --import-options show-only \
                --import "$signing_key" |
                awk -F: '$1 == "fpr" { print $10; exit }'
            )"
            test "$fingerprint" = "$FFMPEG_SIGNING_KEY_FINGERPRINT"
            gpg --batch --import "$signing_key"
            gpg --batch --verify "$signature" "$archive"
          fi

      - name: Cache FFmpeg 9.0.1 libraries on Unix
        if: runner.os != 'Windows'
        id: ffmpeg-unix-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-9.0.1
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-9.0.1-shared-v2

      - name: Build FFmpeg 9.0.1 libraries on Unix
        if: runner.os != 'Windows' && steps.ffmpeg-unix-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-$FFMPEG_VERSION.tar.xz"
          source_root="$RUNNER_TEMP/ffmpeg-source"
          prefix="$RUNNER_TEMP/ffmpeg-$FFMPEG_VERSION"

          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "$archive" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
          fi
          test "$actual" = "$FFMPEG_SOURCE_SHA256"

          mkdir -p "$source_root"
          tar -xJf "$archive" -C "$source_root"
          cd "$source_root/ffmpeg-$FFMPEG_VERSION"
          ./configure \
            --prefix="$prefix" \
            --disable-autodetect \
            --disable-doc \
            --disable-programs \
            --disable-static \
            --disable-x86asm \
            --enable-pic \
            --enable-shared

          if [ "$RUNNER_OS" = "macOS" ]; then
            jobs="$(sysctl -n hw.logicalcpu)"
          else
            jobs="$(nproc)"
          fi
          make -j"$jobs"
          make install

      - name: Configure FFmpeg 9.0.1 on Unix
        if: runner.os != 'Windows'
        run: |
          prefix="$RUNNER_TEMP/ffmpeg-$FFMPEG_VERSION"
          test -f "$prefix/lib/pkgconfig/libavcodec.pc"
          echo "FFMPEG_DIR=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "DYLD_FALLBACK_LIBRARY_PATH=$prefix/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}" >> "$GITHUB_ENV"
          else
            echo "LD_LIBRARY_PATH=$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Cache FFmpeg 9.0.1 shared build on Windows
        if: runner.os == 'Windows'
        id: ffmpeg-windows-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-9.0.1-windows
          key: ffmpeg-Windows-${{ runner.arch }}-9.0.1-shared-v2

      - name: Download FFmpeg 9.0.1 shared build on Windows
        if: runner.os == 'Windows' && steps.ffmpeg-windows-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-$env:FFMPEG_VERSION-full_build-shared.zip"
          $destination = Join-Path $env:RUNNER_TEMP "ffmpeg-$env:FFMPEG_VERSION-windows"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/ffmpeg-$env:FFMPEG_VERSION-full_build-shared.zip"

          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-Item -LiteralPath $archive).Length -ne [long]$env:FFMPEG_WINDOWS_SIZE) {
            throw "FFmpeg size mismatch"
          }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:FFMPEG_WINDOWS_SHA256) {
            throw "FFmpeg checksum mismatch: expected $env:FFMPEG_WINDOWS_SHA256, got $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination

      - name: Configure FFmpeg and MSVC on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $destination = Join-Path $env:RUNNER_TEMP "ffmpeg-$env:FFMPEG_VERSION-windows"
          $ffmpeg = Get-ChildItem -LiteralPath $destination -Directory -Recurse |
            Where-Object Name -eq "ffmpeg-$env:FFMPEG_VERSION-full_build-shared" |
            Select-Object -First 1
          if ($null -eq $ffmpeg) {
            throw "FFmpeg shared build was not found under $destination"
          }

          $libclang = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path -LiteralPath "$libclang\libclang.dll")) {
            throw "libclang.dll was not found at $libclang"
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsPath)) {
            throw "Visual Studio 2022 C++ tools were not found"
          }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"

          "FFMPEG_DIR=$($ffmpeg.FullName)" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$libclang" >> $env:GITHUB_ENV
          "VCVARS64=$vcvars" >> $env:GITHUB_ENV
          (Join-Path $ffmpeg.FullName "bin") >> $env:GITHUB_PATH

      - name: Check Rust formatting and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          python scripts/verify-ffmpeg-software-differential.py --self-test
          node --check static/app.js
          node --check docs/ui-ux/wireframe.js

      - name: Check generated capability registry
        run: cargo run --locked --bin generate_capabilities -- --check

      - name: Check, test, and lint on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets --all-features
          cargo test --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check, test, and lint on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmd /c "`"$env:VCVARS64`" >nul && cargo check --locked --all-targets --all-features"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$env:VCVARS64`" >nul && cargo test --locked --all-targets --all-features"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$env:VCVARS64`" >nul && cargo clippy --locked --all-targets --all-features -- -D warnings"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prove control-plane reachability and LAN packet secrecy
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --bin collide-o-scope
          sudo env "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" \
            bash scripts/p0-control-server-netns.sh target/debug/collide-o-scope

  dependency-policy:
    name: Dependency policy and supply-chain provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustc --version --verbose
          cargo --version

      - name: Cache Cargo downloads and verification tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: dependency-policy-${{ runner.os }}-${{ runner.arch }}-deny-0.20.2-audit-0.22.2-${{ hashFiles('Cargo.lock') }}

      - name: Install pinned dependency verifiers
        run: |
          if [ "$(cargo-deny --version 2>/dev/null)" != "cargo-deny 0.20.2" ]; then
            cargo install --locked --force cargo-deny --version 0.20.2
          fi
          test "$(cargo-deny --version)" = "cargo-deny 0.20.2"
          if [ "$(cargo-audit --version 2>/dev/null)" != "cargo-audit 0.22.2" ]; then
            cargo install --locked --force cargo-audit --version 0.22.2
          fi
          test "$(cargo-audit --version)" = "cargo-audit 0.22.2"

      - name: Fetch locked dependencies and verify vendored source
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          python scripts/verify-vendored-wgpu-hal.py --self-test

      - name: Reject stale or unowned advisory exceptions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check-dependency-policy.py
          python scripts/check-release-workflow.py
          python scripts/verify-release.py self-test

      - name: Check advisories, bans, and sources
        run: |
          cargo deny check advisories bans sources
          python scripts/run-cargo-audit.py

      - name: Check declared dependency licenses separately
        run: |
          cargo deny check licenses
          cargo deny list --format json
